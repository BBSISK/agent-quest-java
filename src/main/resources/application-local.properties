# "local" profile: develop the game screen without starting the RDS database (and without its cost).
# Games live in an in-memory H2 database built from schema.sql and vanish when the server stops.
# Bedrock is still real, so each turn costs a fraction of a cent.
# Run:  mvn spring-boot:run -Dspring-boot.run.profiles=local
spring.datasource.url=jdbc:h2:mem:quest;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
