# Amazon RDS (MySQL). Never put the password here: it comes from environment variables, e.g.
#   export DB_HOST=agent-quest-db.xxxxxxxx.eu-west-1.rds.amazonaws.com
#   export DB_PASSWORD='...'
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/agent_quest
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:}
